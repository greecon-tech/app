# Publishes a static demo snapshot to GitHub Pages — real seeded data baked
# into static HTML at build time, no live backend or database involved once
# published. Builds one variant per user role (owner, admin, operator, viewer,
# auditor) so the demo shows what each role actually sees, and combines them
# into one Pages artifact under sibling paths. See docs/12-deployment-github-pages.md.
name: Publish demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install

      - run: npm run build:packages && npm run build:api

      - name: Start the API on seeded demo data
        run: |
          node apps/api/dist/main.js &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4000/health && exit 0
            sleep 1
          done
          echo "API did not become healthy in time" >&2
          exit 1

      - name: Build a static export per user role
        env:
          NEXT_OUTPUT_EXPORT: "1"
          GREECON_API_URL: http://localhost:4000
          GREECON_SITE_ROOT: /${{ github.event.repository.name }}
        run: |
          set -e
          mkdir -p publish
          # "operator" stays at the site root so the existing published URL keeps working;
          # the other roles publish alongside it so every role has its own link.
          for role in operator owner admin viewer auditor; do
            rm -rf apps/web/.next apps/web/out
            if [ "$role" = "operator" ]; then
              dest="publish"
              export NEXT_BASE_PATH="$GREECON_SITE_ROOT"
            else
              dest="publish/$role"
              export NEXT_BASE_PATH="$GREECON_SITE_ROOT/$role"
            fi
            export GREECON_DEMO_ROLE="$role"
            apps/web/scripts/build-static.sh
            mkdir -p "$dest"
            cp -r apps/web/out/. "$dest/"
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
